server.port=${PORT:8080}
spring.application.name=code3d-backend

# Database Configuration (Defaults to embedded H2 for instant offline/local run; uses Neon PostgreSQL when SPRING_DATASOURCE_URL is set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:code3ddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging configuration
logging.level.com.code3d=INFO
logging.level.org.springframework.web=INFO
