<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CODE3D-AI</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect trick
      // Converts path to hash format for single-page routing
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var search = l.search ? (path ? '&' : '?') + l.search.slice(1) : '';
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' + path + search + l.hash;
      window.location.replace(newUrl);
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding-top: 50px; color: #64748b;">
      <h2>Redirecting to CODE3D-AI...</h2>
    </div>
  </body>
</html>
